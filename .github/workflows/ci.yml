name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: SQLite in real Electron
        if: runner.os == 'Windows'
        run: npm run check:electron
      - name: Electron runtime report
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v7
        with:
          name: electron-runtime-windows
          path: test-results/electron-runtime/report.json
          if-no-files-found: error
          retention-days: 14
