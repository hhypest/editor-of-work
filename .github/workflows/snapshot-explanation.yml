name: Sheet snapshots

# Отдельный workflow: правка описания PR перезапускает только эту проверку, а не всю CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explained:
    name: sheet snapshots explained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Snapshot changes are explained in the PR description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-snapshot-explanation.mjs
